
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>


   
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #306f88, #6bb8e9);
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.13);
            filter: blur(30px);
            z-index: -1;
        }

        body::before {
            top: -80px;
            left: -70px;
        }

        body::after {
            bottom: -80px;
            right: -70px;
        }

        .back-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            color: #e9f7ff;
        }

        .main-container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.97);
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.20);
        }

        .form-title {
            text-align: center;
            color: #306f88;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: bold;
            color: #333;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #306f88;
            box-shadow: 0 0 0 0.2rem rgba(48, 111, 136, 0.15);
        }

        .upload-box {
            margin-top: 18px;
            padding: 15px;
            border: 2px dashed #6bb8e9;
            border-radius: 12px;
            text-align: center;
            background: #f7fcff;
        }

        .upload-btn {
            background: #306f88;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: #24586d;
        }

        #fileName {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }

        #imageInput {
            display: none;
        }

        .generate-btn {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #306f88, #6bb8e9);
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .generate-btn:hover {
            opacity: 0.92;
        }

        #resultSection {
            display: none;
            margin-top: 30px;
        }

        /* ID CARD */
        .id-card {
            width: 85.60mm;
            height: 53.98mm;
            max-width: 100%;
            margin: auto;
            background: white;
            border-radius: 2mm;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* CARD HEADER */
        .id-card-header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #306f88, #6bb8e9);
            color: white;
            text-align: center;
            padding: 2mm 12mm 2mm 2mm;
            position: relative;
            min-height: 12mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .id-card-header h2 {
            margin: 0;
            font-size: 3.2mm;
            line-height: 1.2;
            font-weight: bold;
        }

        .id-card-header p {
            margin: 1mm 0 0;
            font-size: 2.7mm;
            line-height: 1.1;
            font-weight: bold;
        }

        /* LOGO TOP RIGHT */
        .card-logo {
            position: absolute;
            top: 1.5mm;
            right: 2mm;
            width: 9mm;
            height: 9mm;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 0.5mm;
            display: block;
        }

        /* CARD BODY */
        .id-card-body {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: stretch;
            padding: 2mm;
            gap: 2mm;
            overflow: hidden;
        }

        /* LEFT SECTION */
        .left-section {
            width: 34%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            gap: 1mm;
        }

        .candidate-photo {
            width: 19mm;
            height: 19mm;
            object-fit: cover;
            border-radius: 1.5mm;
            border: 0.6mm solid #306f88;
            display: block;
            background: #f3f3f3;
            flex-shrink: 0;
        }

        .qr-box {
            width: 19mm;
            height: 19mm;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .qr-box img,
        .qr-box canvas {
            width: 19mm !important;
            height: 19mm !important;
            max-width: 100%;
            display: block;
        }

        /* RIGHT SECTION */
        .details-section {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            border-bottom: 0.2mm solid #e5e5e5;
            padding: 1mm 0;
            font-size: 2.4mm;
            line-height: 1.2;
            min-width: 0;
        }

        .detail-label {
            width: 19mm;
            flex-shrink: 0;
            font-weight: bold;
            color: #306f88;
        }

        .detail-value {
            flex: 1;
            min-width: 0;
            color: #222;
            overflow-wrap: anywhere;
        }

        #generatedByInfo {
            margin-top: 1.5mm;
            padding-top: 1mm;
            border-top: 0.5mm solid #306f88;
            font-size: 1.9mm;
            line-height: 1.25;
            color: #555;
            overflow-wrap: anywhere;
        }

        #generatedByInfo strong {
            color: #306f88;
        }

        /* DOWNLOAD BUTTON */
        .download-btn {
            width: 100%;
            max-width: 720px;
            margin: 18px auto 0;
            display: block;
            border: none;
            background: #306f88;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #24586d;
        }

        .warning-text {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            body {
                padding: 18px 10px;
            }

            .form-box {
                padding: 20px 15px;
            }

            .id-card {
                width: 85.60mm;
                height: 53.98mm;
                max-width: 100%;
            }

            .id-card-body {
                gap: 1.5mm;
                padding: 1.5mm;
            }

            .left-section {
                width: 34%;
            }

            .candidate-photo {
                width: 18mm;
                height: 18mm;
            }

            .qr-box {
                width: 19mm;
                height: 19mm;
                margin-top: 1mm;
            }

            .qr-box img,
            .qr-box canvas {
                width: 19mm !important;
                height: 19mm !important;
                display: block;
                image-rendering: pixelated;
            }

            .id-card-header h2 {
                font-size: 3mm;
            }

            .id-card-header p {
                font-size: 2.5mm;
            }

            .detail-row {
                font-size: 2.2mm;
                padding: 0.8mm 0;
            }

            .detail-label {
                width: 17mm;
            }

            #generatedByInfo {
                font-size: 1.8mm;
            }

            .card-logo {
                width: 8mm;
                height: 8mm;
                top: 1.5mm;
                right: 1.5mm;
            }
        }

        @media (max-width: 350px) {
            .id-card-body {
                gap: 1mm;
                padding: 1mm;
            }

            .detail-label {
                width: 15mm;
            }

            .detail-row {
                font-size: 2mm;
            }
        }

        /* PRINT */
        @media print {
            @page {
                size: 85.60mm 53.98mm;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: white;
            }

            .id-card {
                width: 85.60mm;
                height: 53.98mm;
                max-width: none;
                margin: 0;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">

        <a href="dashboard.html" class="back-btn">
            ← Back to Dashboard
        </a>

        <!-- FORM -->
        <div class="form-box">

            <h2 class="form-title">QR Code Generator</h2>

            <form id="qrForm">

                <div class="mb-3">
                    <label class="form-label" for="cnic">CNIC</label>
                    <input type="text" id="cnic" class="form-control"
                        placeholder="42101-1234567-1"
                        maxlength="15" inputmode="numeric"
                        pattern="[0-9]{5}-[0-9]{7}-[0-9]"
                        title="CNIC format: 42101-1234567-1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="form-control"
                        placeholder="Enter Full Name"
                        pattern="[A-Za-z ]+"
                        title="Name mein sirf letters aur spaces likhein" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="fathername">Father Name</label>
                    <input type="text" id="fathername" class="form-control"
                        placeholder="Enter Father Name"
                        pattern="[A-Za-z ]+"
                        title="Father Name mein sirf letters aur spaces likhein" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control"
                        placeholder="03XXXXXXXXX"
                        maxlength="11" inputmode="numeric"
                        pattern="03[0-9]{9}"
                        title="11 digits enter karein aur 03 se start karein" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control"
                        placeholder="example@gmail.com" required>
                </div>

                <!-- CANDIDATE PHOTO -->
                <div class="upload-box">

                    <label class="form-label d-block mb-2" for="imageInput">
                        Candidate Picture
                    </label>

                    <input type="file" id="imageInput" accept="image/*">

                    <button type="button" class="upload-btn"
                        onclick="document.getElementById('imageInput').click()">
                        📷 Upload Own Picture
                    </button>

                    <div id="fileName">No picture selected</div>

                    <div id="imageWarning" class="warning-text">
                        Please upload candidate picture.
                    </div>

                </div>

                <button type="submit" class="generate-btn">
                    Generate QR Code
                </button>

            </form>
        </div>

        <!-- GENERATED RESULT -->
        <div id="resultSection">

            <div id="idCard" class="id-card">

                <!-- CARD HEADER WITH FIXED LOGO -->
                <div class="id-card-header">

                    <img src="logo.jpeg" class="card-logo" alt="Jamat Logo"
                        crossorigin="anonymous">

                    <h2>SUTHRA PARA SYED JAMAT (REG)</h2>

                    <p>Candidate Card</p>

                </div>

                <!-- CARD BODY -->
                <div class="id-card-body">

                    <div class="left-section">

                        <img id="candidatePhoto" class="candidate-photo"
                            alt="Candidate Picture">

                        <div id="qrcode" class="qr-box"></div>

                    </div>

                    <div class="details-section">

                        <div class="detail-row">
                            <div class="detail-label">CNIC:</div>
                            <div class="detail-value" id="showCnic"></div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">Full Name:</div>
                            <div class="detail-value" id="showFullname"></div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">Father Name:</div>
                            <div class="detail-value" id="showFathername"></div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">Phone:</div>
                            <div class="detail-value" id="showPhone"></div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">Email:</div>
                            <div class="detail-value" id="showEmail"></div>
                        </div>

                        <div id="generatedByInfo"></div>

                    </div>
                </div>
            </div>

            <button type="button" class="download-btn" onclick="downloadQR()">
                Download ID Card
            </button>

        </div>

    </div>

    <!-- QR CODE LIBRARY -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <!-- HTML2CANVAS -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


  
<script>
    let qrCode;
    let savedRecords = [];

    // LOAD SAVED RECORDS
    try {
        savedRecords = JSON.parse(localStorage.getItem("qrRecords")) || [];
    } catch (error) {
        savedRecords = [];
    }

    // GET LOGGED-IN ADMIN
    function getLoggedInAdmin() {
        try {
            const admin = JSON.parse(sessionStorage.getItem("loggedInUser"));

            if (admin && admin.name && admin.email && admin.post) {
                return admin;
            }
        } catch (error) {
            console.log("Admin data error");
        }

        return null;
    }

    // INPUT ELEMENTS
    const cnicInput = document.getElementById("cnic");
    const fullnameInput = document.getElementById("fullname");
    const fathernameInput = document.getElementById("fathername");
    const phoneInput = document.getElementById("phone");
    const emailInput = document.getElementById("email");

    // CNIC: Allow digits and hyphens only
    cnicInput.addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9-]/g, "").slice(0, 15);
    });

    // FULL NAME: English letters and spaces only
    fullnameInput.addEventListener("input", function () {
        this.value = this.value.replace(/[^A-Za-z ]/g, "");
    });

    // FATHER NAME: English letters and spaces only
    fathernameInput.addEventListener("input", function () {
        this.value = this.value.replace(/[^A-Za-z ]/g, "");
    });

    // PHONE: Digits only, maximum 11
    phoneInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 11);
    });

    // IMAGE UPLOAD
    let selectedImage = "";

    const imageInput = document.getElementById("imageInput");
    const fileName = document.getElementById("fileName");
    const imageWarning = document.getElementById("imageWarning");

    imageInput.addEventListener("change", function () {
        const file = this.files[0];

        selectedImage = "";

        if (!file) {
            fileName.textContent = "No picture selected";
            return;
        }

        if (!file.type.startsWith("image/")) {
            alert("Please select a valid image.");
            this.value = "";
            fileName.textContent = "No picture selected";
            return;
        }

        // Avoid very large images
        if (file.size > 5 * 1024 * 1024) {
            alert("Picture size must be 5 MB or less.");
            this.value = "";
            fileName.textContent = "No picture selected";
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {
            selectedImage = event.target.result;
            fileName.textContent = file.name;
            imageWarning.style.display = "none";
        };

        reader.onerror = function () {
            selectedImage = "";
            alert("Unable to read this picture. Please try another image.");
        };

        reader.readAsDataURL(file);
    });

    // FORM SUBMIT
    document.getElementById("qrForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const cnic = cnicInput.value.trim();
        const fullname = fullnameInput.value.trim();
        const fathername = fathernameInput.value.trim();
        const phone = phoneInput.value.trim();
        const email = emailInput.value.trim();

        // ADMIN CHECK
        const admin = getLoggedInAdmin();

        if (!admin) {
            alert("Please login first.");
            window.location.href = "login.html";
            return;
        }

        // IMAGE REQUIRED
        if (!selectedImage) {
            imageWarning.style.display = "block";
            alert("Please upload candidate picture first.");
            return;
        }

        // CNIC VALIDATION
        const cnicPattern = /^\d{5}-\d{7}-\d$/;

        if (!cnicPattern.test(cnic)) {
            alert("Enter CNIC in this format: 42101-1234567-1");
            cnicInput.focus();
            return;
        }

        // NAME VALIDATION
        const namePattern = /^[A-Za-z]+(?: [A-Za-z]+)*$/;

        if (!namePattern.test(fullname)) {
            alert("Full Name mein sirf English letters aur spaces likhein.");
            fullnameInput.focus();
            return;
        }

        if (!namePattern.test(fathername)) {
            alert("Father Name mein sirf English letters aur spaces likhein.");
            fathernameInput.focus();
            return;
        }

        // PHONE VALIDATION
        const phonePattern = /^03\d{9}$/;

        if (!phonePattern.test(phone)) {
            alert("Phone number 11 digits ka hona chahiye aur 03 se start hona chahiye.");
            phoneInput.focus();
            return;
        }

        // EMAIL VALIDATION
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            alert("Please enter a valid email, for example example@gmail.com.");
            emailInput.focus();
            return;
        }

        // REFRESH RECORDS BEFORE DUPLICATE CHECK
        try {
            savedRecords = JSON.parse(localStorage.getItem("qrRecords")) || [];
        } catch (error) {
            savedRecords = [];
        }

        // DUPLICATE CHECK
        if (savedRecords.some(record => record.cnic === cnic)) {
            alert("This CNIC has already been used.");
            return;
        }

        if (savedRecords.some(record => record.phone === phone)) {
            alert("This phone number has already been used.");
            return;
        }

        if (savedRecords.some(record => record.email.toLowerCase() === email.toLowerCase())) {
            alert("This email has already been used.");
            return;
        }

        // DATE AND TIME
        const generatedAt = new Date().toLocaleString("en-GB", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });

        // QR DATA
        const qrData = `SUTHRA PARA SYED JAMAT (REG)
Candidate Card

CNIC: ${cnic}
Full Name: ${fullname}
Father Name: ${fathername}
Phone: ${phone}
Email: ${email}

Generated By: ${admin.name}
Post: ${admin.post}
Generated At: ${generatedAt}`;

        // SHOW CARD DETAILS
        document.getElementById("showCnic").textContent = cnic;
        document.getElementById("showFullname").textContent = fullname;
        document.getElementById("showFathername").textContent = fathername;
        document.getElementById("showPhone").textContent = phone;
        document.getElementById("showEmail").textContent = email;
        document.getElementById("candidatePhoto").src = selectedImage;

        // GENERATE QR CODE
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";

        qrCode = new QRCode(qrContainer, {
            text: qrData,
            width: 300,
            height: 300,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        // SHOW ADMIN INFORMATION
        const generatedByInfo = document.getElementById("generatedByInfo");
        generatedByInfo.replaceChildren();

        function addAdminLine(label, value) {
            const strong = document.createElement("strong");
            strong.textContent = label;

            generatedByInfo.appendChild(strong);
            generatedByInfo.appendChild(document.createTextNode(" " + value));
            generatedByInfo.appendChild(document.createElement("br"));
        }

        addAdminLine("Generated By:", admin.name);
        addAdminLine("Post:", admin.post);
        addAdminLine("Generated At:", generatedAt);

        // SAVE RECORD
        const newRecord = {
            id: Date.now(),
            cnic,
            fullname,
            fathername,
            phone,
            email,
            image: selectedImage,
            generatedBy: admin.name,
            generatedByEmail: admin.email,
            generatedByPost: admin.post,
            generatedAt
        };

        savedRecords.push(newRecord);

        try {
            localStorage.setItem("qrRecords", JSON.stringify(savedRecords));
        } catch (error) {
            savedRecords.pop();
            alert("Record save nahi ho saka. Browser storage full ho sakti hai; picture chhoti karke dobara try karein.");
            return;
        }

        // SHOW RESULT
        document.getElementById("resultSection").style.display = "block";

        document.getElementById("resultSection").scrollIntoView({
            behavior: "smooth"
        });
    });

    // DOWNLOAD CARD
    function downloadQR() {
        const card = document.getElementById("idCard");

        html2canvas(card, {
            scale: 3,
            useCORS: true,
            backgroundColor: "#ffffff"
        })
        .then(function (canvas) {
            const link = document.createElement("a");
            link.download = "Candidate-ID-Card.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        })
        .catch(function (error) {
            console.error(error);
            alert("Unable to download ID Card.");
        });
    }
</script>


</body>

</html>
