
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background: #f3f6fa;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            width: 100%;

            height: 70px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 50px;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

            color: #4f46e5;

        }


        .nav-right {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .nav-user {

            color: #333;

            font-weight: bold;

            padding: 10px 5px;

        }


        /* QR BUTTON */

        .qr-btn {

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;

        }


        .qr-btn:hover {

            background: #4338ca;

        }


        /* LOGOUT BUTTON */

        .logout-btn {

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .logout-btn:hover {

            background: #dc2626;

        }


        /* ================= MAIN ================= */

        .main {

            min-height: calc(100vh - 70px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;

        }


        /* ================= DASHBOARD CARD ================= */

        .dashboard {

            width: 500px;

            max-width: 100%;

            background: white;

            padding: 50px 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.10);

            text-align: center;

        }


        .icon {

            font-size: 55px;

            margin-bottom: 20px;

        }


        h1 {

            font-size: 32px;

            margin-bottom: 15px;

            color: #111827;

        }


        .description {

            font-size: 17px;

            line-height: 1.7;

            color: #666;

            margin-bottom: 25px;

        }


        /* USER INFORMATION */

        .user-info {

            margin-top: 15px;

            font-size: 17px;

            color: #555;

        }


        .user-info span {

            color: #4f46e5;

            font-weight: bold;

        }


        /* POST */

        .post {

            margin-top: 12px;

            font-size: 18px;

            font-weight: bold;

            color: #16a34a;

        }


        .post span {

            color: #16a34a;

        }


        /* QR CARD */

        .qr-box {

            margin-top: 30px;

            padding: 20px;

            background: #f8f9ff;

            border-radius: 12px;

            border: 1px solid #e5e7eb;

        }


        .qr-box h3 {

            color: #333;

            margin-bottom: 8px;

        }


        .qr-box p {

            color: #777;

            font-size: 14px;

            margin-bottom: 15px;

        }


        .generate-btn {

            display: inline-block;

            text-decoration: none;

            padding: 12px 22px;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-weight: bold;

        }


        .generate-btn:hover {

            background: #4338ca;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 0 20px;

            }


            .logo {

                font-size: 19px;

            }


            .nav-right {

                gap: 8px;

            }


            .nav-user {

                display: none;

            }


            .qr-btn {

                padding: 9px 12px;

                font-size: 13px;

            }


            .logout-btn {

                padding: 9px 12px;

                font-size: 13px;

            }


            .dashboard {

                padding: 40px 25px;

            }


            h1 {

                font-size: 27px;

            }

        }


        @media (max-width: 450px) {

            .logo {

                font-size: 16px;

            }


            .qr-btn {

                padding: 8px 10px;

            }


            .logout-btn {

                padding: 8px 10px;

            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">


        <div class="logo">

            Sothrapara Syed Jamat

        </div>


        <div class="nav-right">


            <!-- USER NAME -->

            <div class="nav-user">

                <span id="navName">
                    Loading...
                </span>

            </div>


            <!-- QR BUTTON -->

            <a
                href="QR.html"
                class="qr-btn"
            >

                ▣ QR Code

            </a>


            <!-- LOGOUT -->

            <button
                class="logout-btn"
                onclick="logout()"
            >

                Logout

            </button>


        </div>


    </nav>



    <!-- ================= MAIN ================= -->

    <main class="main">


        <div class="dashboard">


            <!-- ICON -->

            <div class="icon">

                🎉

            </div>


            <!-- NAME -->

            <h1 id="welcome">

                Welcome!

            </h1>


            <!-- MESSAGE -->

            <p class="description">

                You have successfully logged in.

                Now click on the QR Code button
                to generate your identification
                QR code for Jamat.

            </p>


            <!-- EMAIL -->

            <div class="user-info">

                Email:

                <span id="userEmail">

                    Loading...

                </span>

            </div>


            <!-- POST -->

            <div class="post">

                Post:

                <span id="userPost">

                    Loading...

                </span>

            </div>


            <!-- QR SECTION -->

            <div class="qr-box">

                <h3>
                    Generate Your QR Code
                </h3>


                <p>
                    Create your Jamat identification QR code.
                </p>


                <a
                    href="QR.html"
                    class="generate-btn"
                >

                    Generate QR Code

                </a>

            </div>


        </div>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* GET LOGIN DATA */

        const userData =
            sessionStorage.getItem("loggedInUser");


        /* CHECK LOGIN */

        if (!userData) {

            window.location.href =
                "index.html";

        }


        else {


            /* CONVERT JSON */

            const user =
                JSON.parse(userData);


            /* SHOW NAME */

            document
                .getElementById("welcome")
                .innerText =
                "Welcome, " + user.name + "!";


            /* SHOW EMAIL */

            document
                .getElementById("userEmail")
                .innerText =
                user.email;


            /* SHOW POST */

            document
                .getElementById("userPost")
                .innerText =
                user.post;


            /* SHOW NAME IN NAVBAR */

            document
                .getElementById("navName")
                .innerText =
                user.name;

        }



        /* ================= LOGOUT ================= */

        function logout() {


            sessionStorage.removeItem(
                "loggedInUser"
            );


            window.location.href =
                "index.html";

        }


    </script>


</body>

</html>
