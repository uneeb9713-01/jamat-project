
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 20px;
        }

        .box {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg,#4f46e5,#7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 18px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .login a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <p class="subtitle">
        Register your account
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

        <div class="input-group">
            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="input-group">
            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >
        </div>

        <div class="input-group">
            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                required
            >
        </div>

        <button type="submit">
            Sign Up
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>

document.getElementById("registerForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        showMessage(
            "Password and Confirm Password do not match!",
            "error"
        );

        return;
    }


    let users =
        JSON.parse(localStorage.getItem("users")) || [];


    const alreadyExists =
        users.some(function(user) {

            return user.email === email;

        });


    if (alreadyExists) {

        showMessage(
            "This email is already registered!",
            "error"
        );

        return;
    }


    const newUser = {

        name: name,

        email: email,

        password: password

    };


    users.push(newUser);


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    showMessage(
        "Registration successful! Opening Login...",
        "success"
    );


    document.getElementById("registerForm").reset();


    setTimeout(function() {

        window.location.href = "login.html";

    }, 1500);

});


function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.className =
        "message " + type;

}

</script>

</body>
</html>
