<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 20px;
        }


        .box {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }


        h1 {
            text-align: center;
            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }


        .input-group {
            margin-bottom: 18px;
        }


        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }


        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }


        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }


        button:hover {
            opacity: 0.92;
        }


        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 18px;
            display: none;
        }


        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }


        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

    </style>

</head>


<body>


    <div class="box">


        <h1>Welcome Back</h1>


        <p class="subtitle">
            Login to your account
        </p>


        <div id="message" class="message"></div>


        <form id="loginForm" autocomplete="off">


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    name="login-email"
                    placeholder="Enter your email"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="login-password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>


        </form>


    </div>



    <script>


        const loginForm =
            document.getElementById("loginForm");


        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");



        /*
            PAGE LOAD PAR FIELDS CLEAR
        */

        window.addEventListener("load", function () {

            emailInput.value = "";

            passwordInput.value = "";

        });



        /*
            PAGE DOBARA OPEN HONE PAR
            FIELDS CLEAR
        */

        window.addEventListener("pageshow", function () {

            emailInput.value = "";

            passwordInput.value = "";

        });



        /*
            LOGIN
        */

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    emailInput.value
                    .trim()
                    .toLowerCase();


                const password =
                    passwordInput.value;



                /*
                    AUTHORIZED USERS
                */

                const authorizedUsers = {


                    "saqib@gmail.com": {

                        name: "Syed Saqib",

                        password: "K7@vQ2!",

                        post: "Information Secretary"

                    },


                    "tahir@gmail.com": {

                        name: "Syed Tahir",

                        password: "Z4#pN8$",

                        post: "Joint Secretary"

                    },


                    "owais@gmail.com": {

                        name: "Syed Owais",

                        password: "M9!xR5@",

                        post: "Naib Secretary"

                    },


                    "nasir@gmail.com": {

                        name: "Syed Nasir  ",

                        password: "T8#kL2@",

                        post: "Finance Secretary"

                    }

                };



                /*
                    USER CHECK
                */

                const user =
                    authorizedUsers[email];



                if (
                    user &&
                    user.password === password
                ) {


                    /*
                        LOGIN USER DATA SAVE
                    */

                    sessionStorage.setItem(

                        "loggedInUser",

                        JSON.stringify({

                            name: user.name,

                            email: email,

                            post: user.post

                        })

                    );



                    /*
                        SUCCESS MESSAGE
                    */

                    showMessage(

                        "Login successful! Opening dashboard...",

                        "success"

                    );



                    /*
                        DASHBOARD REDIRECT
                    */

                    setTimeout(function () {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);


                }

                else {


                    /*
                        ERROR MESSAGE
                    */

                    showMessage(

                        "Invalid email or password!",

                        "error"

                    );

                }

            }
        );



        /*
            MESSAGE FUNCTION
        */

        function showMessage(text, type) {

            const message =
                document.getElementById("message");


            message.innerText = text;


            message.className =
                "message " + type;

        }


    </script>


</body>

</html>
